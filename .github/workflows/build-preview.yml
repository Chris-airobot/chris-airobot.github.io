name: Build and preview al-folio on GitHub Pages

on:
  push:
    branches:
      - redesign/al-folio

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out al-folio preview branch
        uses: actions/checkout@v4

      - name: Set up Ruby and gems
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.5'
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install frontend packages
        run: npm ci

      - name: Install required build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Build al-folio under /al-folio-preview
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --baseurl /al-folio-preview --destination _site_preview --trace

      - name: Fetch original main website without changing it
        uses: actions/checkout@v4
        with:
          ref: main
          path: original-main

      - name: Assemble old homepage plus new preview
        run: |
          mkdir -p _publish/al-folio-preview
          cp -a original-main/. _publish/
          rm -rf _publish/.git _publish/.github
          cp -a _site_preview/. _publish/al-folio-preview/
          test -f _publish/index.html
          test -f _publish/al-folio-preview/index.html

      - name: Upload build artifact for debugging
        uses: actions/upload-artifact@v4
        with:
          name: al-folio-preview-site
          path: _site_preview/
          retention-days: 14

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _publish/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
