name: Publish academic portfolio on GitHub Pages

on:
  push:
    branches:
      - redesign/al-folio

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-portfolio
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out academic website source
        uses: actions/checkout@v4

      - name: Set up Ruby and gems
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.5'
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install frontend packages
        run: npm ci

      - name: Install required build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick ffmpeg

      - name: Verify Monash and RVSS media is uploaded
        run: |
          set -euo pipefail
          for path in \
            assets/videos/monash-pivoting-demo.mp4 \
            assets/images/monash-pivoting-poster.jpg \
            assets/images/monash-pivoting-animated.webp \
            assets/videos/rvss-navigation-demo.mp4 \
            assets/images/rvss-navigation-poster.jpg \
            assets/images/rvss-navigation-animated.webp; do
            test -s "$path" || { echo "MISSING MEDIA: $path"; exit 1; }
          done

      - name: Generate animated Execution-Aware project snapshot
        run: |
          set -euo pipefail
          ffmpeg -hide_banner -loglevel error -y \
            -i assets/videos/execution-preview.mp4 \
            -vf 'fps=10,scale=640:-2:flags=lanczos' \
            -an -c:v libwebp_anim -lossless 0 -quality 50 -compression_level 5 -loop 0 \
            assets/images/execution-preview-animated.webp
          test -s assets/images/execution-preview-animated.webp
          ls -lh assets/images/execution-preview-animated.webp

      - name: Build academic website at root URL
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --baseurl "" --destination _site_release --trace

      - name: Add build revision to Projects navigation links
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os

          root = Path("_site_release")
          previous = "/projects/"
          current = previous + "?v=" + os.environ["GITHUB_SHA"][:12]
          changed_pages = 0
          changed_links = 0
          for page in root.rglob("*.html"):
              html = page.read_text(encoding="utf-8")
              updated = html.replace('href="' + previous + '"', 'href="' + current + '"')
              updated = updated.replace("href='" + previous + "'", "href='" + current + "'")
              if updated != html:
                  changed_pages += 1
                  changed_links += html.count('href="' + previous + '"') + html.count("href='" + previous + "'")
                  page.write_text(updated, encoding="utf-8")
          print(f"Stamped {changed_links} navigation links across {changed_pages} HTML pages: {current}")
          assert changed_links >= 1, "Missing Projects navigation links; check theme output"
          PY

      - name: Verify animated snapshots in built Projects page
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class Images(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.srcs = []
              def handle_starttag(self, tag, attrs):
                  if tag == "img":
                      src = dict(attrs).get("src", "")
                      self.srcs.append(src)

          page = Path("_site_release/projects/index.html")
          assert page.is_file(), f"Missing page: {page}"
          images = Images()
          images.feed(page.read_text(encoding="utf-8"))
          for filename in ("grasp-preview-animated.webp", "execution-preview-animated.webp"):
              media_path = Path("_site_release/assets/images") / filename
              assert media_path.is_file() and media_path.stat().st_size > 0, f"Missing media: {media_path}"
              expected = "/assets/images/" + filename
              assert any(expected in src for src in images.srcs), f"Projects page lacks animated img for {filename}"
              print(f"OK animated snapshot: {filename} ({media_path.stat().st_size} bytes)")
          print("Projects card HTML checked successfully")
          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = []
              def handle_starttag(self, tag, attrs):
                  if tag == "a":
                      self.links.append(dict(attrs).get("href", ""))
          links = Links()
          links.feed(page.read_text(encoding="utf-8"))
          project_links = [href for href in links.links if "projects" in href.lower()]
          print("PROJECT NAV AND CARD LINKS:", repr(project_links[:30]))
          assert any(href.startswith("/projects/?v=") for href in project_links), "Projects navigation does not carry a cache-busting build revision"
          PY

      - name: Keep previous preview URLs working
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import html
          import json
          import shutil

          root = Path("_site_release")
          assert (root / "index.html").is_file(), "Missing new homepage"
          assert (root / "projects/index.html").is_file(), "Missing Projects page"
          assert (root / "experience/index.html").is_file(), "Missing Experience page"
          assert (root / "research/master-thesis-adversarial-rl/index.html").is_file(), "Missing master's thesis page"

          def redirect_page(destination, destination_url):
              destination.parent.mkdir(parents=True, exist_ok=True)
              js_url = json.dumps(destination_url)
              safe_url = html.escape(destination_url, quote=True)
              destination.write_text(
                  '<!doctype html><html lang="en"><head><meta charset="utf-8">'
                  '<meta name="robots" content="noindex">'
                  '<meta http-equiv="refresh" content="0; url=' + safe_url + '">'
                  '<link rel="canonical" href="' + safe_url + '">'
                  '<title>Page moved</title></head><body>'
                  '<p>This page has moved to <a href="' + safe_url + '">its new address</a>.</p>'
                  '<script>location.replace(' + js_url + ' + location.search + location.hash);</script>'
                  '</body></html>', encoding="utf-8"
              )

          # Preserve links previously shared at /al-folio-preview/, including
          # deep project pages, publications, CV and the thesis overview.
          pages = list(root.rglob("*.html"))
          legacy = root / "al-folio-preview"
          redirects = 0
          for page in pages:
              relative = page.relative_to(root)
              canonical = "/" + relative.as_posix()
              if canonical.endswith("/index.html"):
                  canonical = canonical[:-10]
              redirect_page(legacy / relative, canonical)
              redirects += 1

          # Keep older direct links to preview images, PDFs, videos and JS working.
          shutil.copytree(root / "assets", legacy / "assets", dirs_exist_ok=True)

          # Also preserve URLs from the original pre-al-folio portfolio.
          for old, new in [
              ("about.html", "/"),
              ("projects.html", "/projects/"),
              ("publications.html", "/publications/"),
              ("cv.html", "/cv/"),
          ]:
              path = root / old
              if not path.exists():
                  redirect_page(path, new)

          assert (legacy / "index.html").is_file()
          assert (legacy / "projects/index.html").is_file()
          assert (legacy / "assets/videos/g1-box-handling-demo.mp4").is_file()
          print(f"Created {redirects} old preview page redirects; new academic homepage is at /")
          PY

      - name: Upload build artifact for debugging
        uses: actions/upload-artifact@v4
        with:
          name: academic-portfolio-root-site
          path: _site_release/
          retention-days: 14

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site_release/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
