name: Build al-folio preview (no deployment)

on:
  push:
    branches:
      - redesign/al-folio
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4
      - name: Set up Ruby and bundle dependencies
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.5'
          bundler-cache: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Install ImageMagick and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          python3 -m pip install --user nbconvert || true
      - name: Build with Jekyll for preview path
        env:
          JEKYLL_ENV: production
        run: |
          bundle exec jekyll build --baseurl /al-folio-preview --destination _site_preview --trace
      - name: Package built website
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: al-folio-preview-site
          path: _site_preview/
          retention-days: 14
